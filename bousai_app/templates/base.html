<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>{% block title %}防災アプリ{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --app-blue: #2859aa;
      --app-blue-dark: #204b95;
      --page-bg: #f5f7fb;
      --card-shadow: 0 8px 24px rgba(31, 70, 125, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: #26364a;
      background: var(--page-bg);
      font-family: "Noto Sans JP", "Yu Gothic", sans-serif;
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 70px;
      padding: 0 max(24px, calc((100% - 1160px) / 2));
      color: white;
      background: linear-gradient(115deg, var(--app-blue-dark), var(--app-blue));
    }

    h1 {
      margin: 0;
      color: white;
      font-size: 1.65rem;
      letter-spacing: 0.04em;
    }

    h1 a {
      color: inherit;
      text-decoration: none;
    }

    .menu-button {
      border: 0;
      padding: 8px;
      color: white;
      background: transparent;
      font-size: 1.7rem;
      line-height: 1;
      cursor: pointer;
    }

    .site-nav {
      display: none;
      padding: 14px max(24px, calc((100% - 1160px) / 2));
      background: white;
      box-shadow: 0 4px 12px rgba(31, 70, 125, 0.12);
    }

    .site-nav.is-open {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 20px;
    }

    .site-nav a {
      color: var(--app-blue-dark);
      text-decoration: none;
    }

    .site-nav a:hover {
      text-decoration: underline;
    }

    main {
      width: min(920px, calc(100% - 32px));
      margin: 34px auto 64px;
    }

    .home-card {
      margin-bottom: 34px;
      padding: 28px;
      background: white;
      border-radius: 16px;
      box-shadow: var(--card-shadow);
    }

    .home-card h2 {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 18px;
      color: var(--app-blue);
      font-size: 1.45rem;
    }

    .home-card h2 .section-icon {
      font-size: 1.35em;
    }

    @media (max-width: 600px) {
      .app-header {
        min-height: 62px;
        padding: 0 18px;
      }

      h1 {
        font-size: 1.3rem;
      }

      main {
        width: min(100% - 20px, 920px);
        margin-top: 20px;
      }

      .home-card {
        padding: 18px;
        border-radius: 12px;
      }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <h1><a href="{{ url_for('index') }}">防災アプリ</a></h1>
    <button class="menu-button" type="button" aria-label="メニューを開く" aria-expanded="false" aria-controls="site-nav">☰</button>
  </header>

  <nav id="site-nav" class="site-nav">
    <a href="/">ホーム</a> |
    <a href="/shelter_search">避難所検索</a> |
    {% if session.logged_in %}
      <a href="/shelter_register">避難所登録</a> |
    {% endif %}
    <a href="/board">指示・発信ボード</a>
    ｜
    {% if session.logged_in %}
      ログイン中{% if session.username %}（{{ session.username }}）{% endif %}
      <a href="/logout">ログアウト</a>
    {% else %}
      未ログイン
      <a href="/login">ログイン</a>
    {% endif %}
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    const menuButton = document.querySelector('.menu-button');
    const siteNav = document.querySelector('#site-nav');
    menuButton.addEventListener('click', function() {
      const isOpen = siteNav.classList.toggle('is-open');
      menuButton.setAttribute('aria-expanded', String(isOpen));
      menuButton.setAttribute('aria-label', isOpen ? 'メニューを閉じる' : 'メニューを開く');
    });
  </script>
</body>
</html>
